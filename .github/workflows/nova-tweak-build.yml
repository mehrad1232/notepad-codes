name: NOVA Jailbreak Tweak Build
on:
  workflow_dispatch:
  push:
    paths:
      - "NOVA-Web-Engine/tweak/**"
      - ".github/workflows/nova-tweak-build.yml"
jobs:
  package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Theos and iOS SDK
        uses: Randomblock1/theos-action@v1
      - name: Build rootful iOS 12 arm64 package
        working-directory: NOVA-Web-Engine/tweak
        run: make clean package FINALPACKAGE=1
      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Jailbreak-Tweak
          path: NOVA-Web-Engine/tweak/packages/*.deb
          if-no-files-found: error
