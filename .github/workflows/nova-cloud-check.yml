name: NOVA Cloud Checks
on:
  push:
    paths:
      - "NOVA-Web-Engine/cloud/**"
      - ".github/workflows/nova-cloud-check.yml"
  pull_request:
    paths:
      - "NOVA-Web-Engine/cloud/**"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NOVA-Web-Engine/cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: NOVA-Web-Engine/cloud/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q nova_cloud
